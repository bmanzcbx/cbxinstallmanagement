services:
  - type: web
    name: cohort-scheduler-api
    env: node
    rootDir: .
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run start
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    envVars:
      - key: LINEAR_SYNC_DATA_DIR
        value: /var/data/linear-sync
    disks:
      - name: linear-sync-data
        mountPath: /var/data
        sizeGB: 1
